{% extends "base.html" %}
{% block title %}Edit Profile · Personal{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Edit Personal Profile</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Name</label>
      <input name="name" value="{{ user.name }}" class="w-full rounded-lg border px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Mobile</label>
      <input name="mobile" value="{{ user.mobile }}" pattern="[0-9]{10}" maxlength="10" class="w-full rounded-lg border px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Village</label>
      <select name="village" class="w-full rounded-lg border px-3 py-2" required>
        {% set villages = ['Village 1','Village 2','Nanded','Pune'] %}
        {% for v in villages %}
          <option value="{{ v }}" {% if user.village == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm mb-1">Disease</label>
      <select name="disease" class="w-full rounded-lg border px-3 py-2" required>
        {% for d in ['None','Asthma','Bronchitis','COPD','Allergic Rhinitis'] %}
          <option {% if user.disease == d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm mb-1">Age</label>
      <input name="age" type="number" value="{{ user.age }}" min="1" max="120" class="w-full rounded-lg border px-3 py-2" required />
    </div>
    <div class="flex items-center justify-end gap-2">
      <a href="{{ url_for('dashboard') }}" class="px-4 py-2 rounded-lg border">Cancel</a>
      <button class="px-4 py-2 rounded-lg bg-gray-900 text-white">Save</button>
    </div>
  </form>
</div>
{% endblock %}
