{% extends "base.html" %}
{% block title %}Forgot Password · AQI Project{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-2xl shadow p-6">
    <h1 class="text-xl font-semibold mb-4">Reset Password</h1>

    <form action="{{ url_for('forgot_password') }}" method="post" class="space-y-4" onsubmit="return checkMatch()">
      <div>
        <label class="block text-sm text-gray-700 mb-1">Account Type</label>
        <select name="account_type" class="w-full rounded-lg border px-3 py-2" required>
          <option value="personal">Personal</option>
          <option value="institution">Institution</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">Email</label>
        <input type="email" name="email" class="w-full rounded-lg border px-3 py-2" required />
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">New Password</label>
        <input type="password" name="new_password" id="npw" class="w-full rounded-lg border px-3 py-2" required />
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">Confirm Password</label>
        <input type="password" id="cpw" class="w-full rounded-lg border px-3 py-2" required />
        <p id="mismatch" class="hidden text-sm text-red-600 mt-1">Passwords do not match</p>
      </div>

      <button class="w-full py-2 rounded-xl bg-gray-900 text-white">Update Password</button>
    </form>
  </div>
</div>

<script>
function checkMatch(){
  const a = document.getElementById('npw').value;
  const b = document.getElementById('cpw').value;
  const msg = document.getElementById('mismatch');
  if(a !== b){ msg.classList.remove('hidden'); return false; }
  msg.classList.add('hidden');
  return true;
}
</script>
{% endblock %}
