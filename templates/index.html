{% extends "base.html" %}
{% block title %}Home · AQI Project{% endblock %}
{% block content %}
<section class="grid gap-6 md:grid-cols-2">
  <div class="rounded-2xl bg-white p-6 shadow">
    <h2 class="text-lg font-semibold mb-2">Welcome</h2>
    <p class="text-gray-600">Log in or create an account as a Personal user or an Institution to access your AQI dashboard.</p>
  </div>
  <div class="rounded-2xl bg-white p-6 shadow flex items-center justify-between">
    <a href="{{ url_for('login') }}" class="px-4 py-2 rounded-xl bg-gray-900 text-white">Login</a>
    <a href="{{ url_for('register') }}" class="px-4 py-2 rounded-xl border">Register</a>
    <a href="{{ url_for('forgot_password') }}" class="px-4 py-2 rounded-xl border">Forgot Password</a>
  </div>
</section>
{% endblock %}
