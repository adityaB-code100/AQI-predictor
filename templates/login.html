<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · AQI Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset + base */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      width: 100%; max-width: 450px;
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    .card-header {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h2 { font-size: 20px; font-weight: 700; }
    .card-header .close-btn {
      cursor: pointer; font-size: 20px;
      opacity: 0.9; transition: opacity 0.2s;
    }
    .card-header .close-btn:hover { opacity: 1; }

    .card-body { padding: 30px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 15px; transition: all 0.25s;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
      outline: none;
    }

    /* Password field */
    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .password-toggle:hover {
      color: #3b82f6;
      background: #f0f9ff;
    }

    /* Submit */
    .btn {
      width: 100%; padding: 14px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.3s;
      margin-top: 16px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      box-shadow: 0 6px 16px rgba(59,130,246,0.25);
      transform: translateY(-2px);
    }

    /* Links */
    .form-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .forgot-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }
    .register-link {
      color: #64748b;
    }
    .register-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .register-link a:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>Login to AQI Project</h2>
      <span class="close-btn">&times;</span>
    </div>
    <div class="card-body">
      <form action="/login" method="post" id="loginForm">
        <div class="form-group">
          <label for="login_type">Login Type</label>
          <select name="login_type" id="login_type" required>
            <option value="personal">Personal</option>
            <option value="institution">Institution</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" name="password" id="password" required />
            <button type="button" class="password-toggle" id="togglePassword">Show</button>
          </div>
        </div>

        <button class="btn" type="submit">Login</button>

        <div class="form-links">
          <a href="/forgot" class="forgot-link">Forgot password?</a>
          <div class="register-link">
            Don't have an account? <a href="/register">Register</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    
    togglePassword.addEventListener('click', function() {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.textContent = type === 'password' ? 'Show' : 'Hide';
    });

    // Close button functionality
    document.querySelector('.close-btn').addEventListener('click', function() {
      window.history.back();
    });

    // Form submission animation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      
      // Simple form validation
      const email = this.querySelector('input[name="email"]').value;
      const password = this.querySelector('input[name="password"]').value;
      
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      // Simulate successful login
      const btn = this.querySelector('.btn');
      btn.textContent = 'Logging in...';
      btn.style.opacity = '0.8';
      btn.disabled = true;
      
    });
  </script>
</body>
</html>
