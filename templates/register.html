<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · AQI Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset + base */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      width: 100%; max-width: 500px;
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    .card-header {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h2 { font-size: 20px; font-weight: 700; }
    .card-header .close-btn {
      cursor: pointer; font-size: 20px;
      opacity: 0.9; transition: opacity 0.2s;
    }
    .card-header .close-btn:hover { opacity: 1; }

    .card-body { padding: 30px; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 15px; transition: all 0.25s;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
      outline: none;
    }

    /* Toggle Switch */
    .toggle-container {
      display: flex; justify-content: center; align-items: center;
      margin-bottom: 20px;
    }
    .toggle-btn {
      display: flex;
      background: #f1f5f9;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .toggle-btn button {
      flex: 1; padding: 12px;
      border: none; background: transparent;
      font-size: 15px; font-weight: 600;
      cursor: pointer; color: #475569;
      transition: all 0.3s ease;
    }
    .toggle-btn button.active {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff;
    }

    /* Checkbox */
    .checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; color: #475569; }
    .checkbox input { width: auto; accent-color: #3b82f6; }

    /* Submit */
    .btn {
      width: 100%; padding: 14px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.3s;
      margin-top: 16px;
    }
    .btn:hover {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      box-shadow: 0 6px 16px rgba(59,130,246,0.25);
      transform: translateY(-2px);
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hide forms */
    .hidden { display: none; }
    
    /* Login link */
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
    .login-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .login-link a:hover {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>Create an Account</h2>
      <span class="close-btn">&times;</span>
    </div>
    <div class="card-body">
      <!-- Toggle Buttons -->
      <div class="toggle-container">
        <div class="toggle-btn">
          <button id="personal" class="active" type="button">Personal</button>
          <button id="institution" type="button">Institute</button>
        </div>
      </div>
      <!-- Personal Form -->
<form id="personalForm" action="/register" method="POST" novalidate>
  <input type="hidden" name="reg_type" value="personal">

  <div class="form-group">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="name">
  </div>

  <div class="form-group">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email">
  </div>

  <div class="form-group">
    <label for="number">Mobile No</label>
    <input type="number" id="number" name="mobile">
  </div>

  <div class="form-group">
    <label for="village">Select Village:</label>
    <select name="village" id="village" class="form-select">
      <option value="">--Select Village--</option>
      <option value="Nanded">Nanded</option>
      <option value="Pune">Pune</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Nagpur">Nagpur</option>
      <option value="Nashik">Nashik</option>
    </select>
  </div>

  <div class="form-group">
    <label for="disease">Select Disease:</label>
    <select name="disease" id="disease" class="form-select">
      <option value="">--Select Disease--</option>
      <option value="None">None</option>
      <option value="Asthma">Asthma</option>
      <option value="Bronchitis">Bronchitis</option>
      <option value="COPD">COPD</option>
      <option value="Allergic Rhinitis">Allergic Rhinitis</option>
    </select>
  </div>

  <div class="form-group">
    <label for="age">Age</label>
    <input type="number" id="age" name="age">
  </div>

  <div class="form-group">
    <label for="personalPassword">Password</label>
    <input type="password" id="personalPassword" name="password">
  </div>

  <div class="form-group">
    <label for="personalPwConfirm">Confirm Password</label>
    <input type="password" id="personalPwConfirm" name="pwConfirm">
  </div>

  <label class="checkbox">
    <input type="checkbox" id="personalAgree">
    I agree to the Terms and Conditions
  </label>

  <button class="btn" type="submit">Register</button>
</form>
<!-- Institute Form -->
<form id="instituteForm" class="hidden" action="/register" method="POST" novalidate>
  <input type="hidden" name="reg_type" value="institution">

  <div class="form-group">
    <label for="instName">Institute Name</label>
    <input type="text" id="instName" name="institution_name">
  </div>

  <div class="form-group">
  <label for="instType">Institute Type</label>
  <select id="instType" name="institution_type" class="form-select">
    <option value="" disabled selected>Select Institute Type</option>
    <option value="hospital">Hospital</option>
    <option value="school">School</option>
    <option value="college">College</option>
    <option value="other">Other</option>
  </select>
</div>

<div class="form-group">
    <label for="village">Select Village:</label>
    <select name="village" id="village" class="form-select">
      <option value="">--Select Village--</option>
      <option value="Nanded">Nanded</option>
      <option value="Pune">Pune</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Nagpur">Nagpur</option>
      <option value="Nashik">Nashik</option>
    </select>
  </div>

  <div class="form-group">
    <label for="instEmail">Official Email</label>
    <input type="email" id="instEmail" name="email">
  </div>

  <div class="form-group">
    <label for="contact">Contact Number</label>
    <input type="tel" id="contact" name="contact">
  </div>

  <div class="form-group">
    <label for="address">Institute Address</label>
    <input type="text" id="address" name="address">
  </div>

  <div class="form-group">
    <label for="instPassword">Password</label>
    <input type="password" id="instPassword" name="password">
  </div>

  <div class="form-group">
    <label for="instPwConfirm">Confirm Password</label>
    <input type="password" id="instPwConfirm" name="pwConfirm">
  </div>

  <label class="checkbox">
    <input type="checkbox" id="instAgree">
    I agree to the Terms and Conditions
  </label>

  <button class="btn" type="submit">Register Institute</button>
</form>

  

     
      
      <!-- Login Link -->
      <div class="login-link">
        Already have an account? <a href="/login">Login here</a>
      </div>
    </div>
  </div>

  <script>
  const personalBtn = document.getElementById("personal");
  const instituteBtn = document.getElementById("institution");
  const personalForm = document.getElementById("personalForm");
  const instituteForm = document.getElementById("instituteForm");

  personalBtn.addEventListener("click", () => {
    personalBtn.classList.add("active");
    instituteBtn.classList.remove("active");
    personalForm.classList.remove("hidden");
    instituteForm.classList.add("hidden");
  });

  instituteBtn.addEventListener("click", () => {
    instituteBtn.classList.add("active");
    personalBtn.classList.remove("active");
    instituteForm.classList.remove("hidden");
    personalForm.classList.add("hidden");
  });

  // Close button functionality
  document.querySelector('.close-btn').addEventListener('click', function() {
    window.history.back();
  });

  // Custom validation
  function validateForm(e, type) {
    e.preventDefault();
    let valid = true;

    if (type === "personal") {
      const name = document.getElementById("firstName").value.trim();
      const email = document.getElementById("email").value.trim();
      const number = document.getElementById("number").value.trim();
      const village = document.getElementById("village").value;
      const disease = document.getElementById("disease").value;
      const age = document.getElementById("age").value.trim();
      const pw = document.getElementById("personalPassword").value;
      const pwc = document.getElementById("personalPwConfirm").value;
      const agree = document.getElementById("personalAgree").checked;

      if (!name || !email || !number || !village || !disease || !age || !pw || !pwc) {
        alert("Please fill in all fields.");
        valid = false;
      } else if (pw !== pwc) {
        alert("Passwords do not match.");
        valid = false;
      } else if (!agree) {
        alert("You must agree to the Terms and Conditions.");
        valid = false;
      }
    } else {
      const instName = document.getElementById("instName").value.trim();
      const instEmail = document.getElementById("instEmail").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const address = document.getElementById("address").value.trim();
      const pw = document.getElementById("instPassword").value;
      const pwc = document.getElementById("instPwConfirm").value;
      const agree = document.getElementById("instAgree").checked;

      if (!instName || !instEmail || !contact || !address || !pw || !pwc) {
        alert("Please fill in all fields.");
        valid = false;
      } else if (pw !== pwc) {
        alert("Passwords do not match.");
        valid = false;
      } else if (!agree) {
        alert("You must agree to the Terms and Conditions.");
        valid = false;
      }
    }
    if (valid) e.target.submit();
  }

  personalForm.addEventListener("submit", (e) => validateForm(e, "personal"));
  instituteForm.addEventListener("submit", (e) => validateForm(e, "institute"));
</script>
