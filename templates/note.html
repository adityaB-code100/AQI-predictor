{% extends "base.html" %}
{% block content %}

<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Notes</title>
</head>
<body>
    <h1>{{ name }}</h1>
    <h1>{{ date }}</h1>

    <!-- Add Note -->

        <textarea name="content" placeholder="Content" required></textarea>
        <button type="submit">Add Note</button>
    </form>

    <hr>

   

  {% endblock %}
