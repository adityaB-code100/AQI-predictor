{% extends "base.html" %}
{% block title %}Edit Profile · Institution{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Edit Institution Profile</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm mb-1">Institution Name</label>
      <input name="institution_name" value="{{ inst.institution_name }}" class="w-full rounded-lg border px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Type</label>
      <select name="institution_type" class="w-full rounded-lg border px-3 py-2" required>
        {% for t in ['hospital','school','college','village'] %}
          <option value="{{ t }}" {% if inst.institution_type == t %}selected{% endif %}>{{ t | capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm mb-1">Contact</label>
      <input name="contact" value="{{ inst.contact }}" pattern="[0-9]{10}" maxlength="10" class="w-full rounded-lg border px-3 py-2" required />
    </div>
    <div class="flex items-center justify-end gap-2">
      <a href="{{ url_for('profile') }}" class="px-4 py-2 rounded-lg border">Cancel</a>
      <button class="px-4 py-2 rounded-lg bg-gray-900 text-white">Save</button>
    </div>
  </form>
</div>
{% endblock %}
