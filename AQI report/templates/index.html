<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Air Quality & Weather Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f8;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            max-width: 1200px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px 40px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            display: block;
            width: 200px;
            margin: 0 auto;
            padding: 12px 0;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        @media (max-width: 768px) {
            .form-section {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>

<body>
    <h2>Air Quality & Weather Data Entry</h2>
    <form method="POST" action="/generate">
        <!-- Air Pollutants Section -->
        <div class="form-section">
            <div>
                <label>PM2.5 (µg/m³):</label><input type="text" name="pm25">
            </div>
            <div>
                <label>PM10 (µg/m³):</label><input type="text" name="pm10">
            </div>
            <div>
                <label>NO (µg/m³):</label><input type="text" name="no">
            </div>
            <div>
                <label>NO₂ (µg/m³):</label><input type="text" name="no2">
            </div>
            <div>
                <label>NOx (ppb):</label><input type="text" name="nox">
            </div>
            <div>
                <label>NH₃ (µg/m³):</label><input type="text" name="nh3">
            </div>
            <div>
                <label>SO₂ (µg/m³):</label><input type="text" name="so2">
            </div>
            <div>
                <label>CO (mg/m³):</label><input type="text" name="co">
            </div>
            <div>
                <label>Ozone (µg/m³):</label><input type="text" name="ozone">
            </div>
            <div>
                <label>Benzene (µg/m³):</label><input type="text" name="benzene">
            </div>
            <div>
                <label>Toluene (µg/m³):</label><input type="text" name="toluene">
            </div>
            <div>
                <label>Xylene (µg/m³):</label><input type="text" name="xylene">
            </div>
            <div>
                <label>O-Xylene (µg/m³):</label><input type="text" name="o_xylene">
            </div>
            <div>
                <label>Ethyl-Benzene (µg/m³):</label><input type="text" name="eth_benzene">
            </div>
            <div>
                <label>MP-Xylene (µg/m³):</label><input type="text" name="mp_xylene">
            </div>
        </div>

        <!-- Weather Data Section -->
        <div class="form-section">
            <div>
                <label>Air Temperature (°C):</label><input type="text" name="at">
            </div>
            <div>
                <label>Relative Humidity (%):</label><input type="text" name="rh">
            </div>
            <div>
                <label>Wind Speed (m/s):</label><input type="text" name="ws">
            </div>
            <div>
                <label>Wind Direction (°):</label><input type="text" name="wd">
            </div>
            <div>
                <label>Rainfall (mm):</label><input type="text" name="rf">
            </div>
            <div>
                <label>Total Rainfall (mm):</label><input type="text" name="tot_rf">
            </div>
            <div>
                <label>Solar Radiation (W/m²):</label><input type="text" name="sr">
            </div>
            <div>
                <label>Barometric Pressure (mmHg):</label><input type="text" name="bp">
            </div>
            <div>
                <label>Temperature 2m (°C):</label><input type="text" name="temperature_2m">
            </div>
            <div>
                <label>Relative Humidity 2m (%):</label><input type="text" name="relative_humidity_2m">
            </div>
            <div>
                <label>Rain 2m (mm):</label><input type="text" name="rain">
            </div>
            <div>
                <label>Surface Pressure (hPa):</label><input type="text" name="surface_pressure">
            </div>
            <div>
                <label>Wind Speed 10m (km/h):</label><input type="text" name="wind_speed_10m">
            </div>
            <div>
                <label>Wind Speed 100m (km/h):</label><input type="text" name="wind_speed_100m">
            </div>
            <div>
                <label>Wind Direction 10m (°):</label><input type="text" name="wind_direction_10m">
            </div>
            <div>
                <label>Wind Direction 100m (°):</label><input type="text" name="wind_direction_100m">
            </div>
        </div>

        <button type="submit">Generate Report</button>
    </form>
</body>

</html>
